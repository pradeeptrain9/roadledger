<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .bg { fill: #fbfaf8; }
    .box { fill: #ffffff; stroke: #d8d4cc; stroke-width: 1.5; rx: 8; }
    .aws { fill: #fff8ec; stroke: #e0a558; }
    .arm { fill: #eef6f2; stroke: #4e9b85; }
    .cv  { fill: #eef1f8; stroke: #6a7fc4; }
    .hum { fill: #fdf0f0; stroke: #c47a7a; }
    .zone { fill: none; stroke: #c9c4ba; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 10; }
    .t  { font-size: 13px; fill: #1a1a1a; }
    .tb { font-size: 13px; fill: #1a1a1a; font-weight: 600; }
    .s  { font-size: 11px; fill: #6b6b6b; }
    .zt { font-size: 11px; fill: #8a857c; font-weight: 600; letter-spacing: .06em; }
    .ln { stroke: #9a948a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .lnk { stroke: #4e9b85; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .lnd { stroke: #9a948a; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#a); }
    .el { font-size: 10.5px; fill: #6b6b6b; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9a948a"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4e9b85"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="660"/>

  <text x="24" y="30" class="tb" font-size="16">RoadLedger — OpenCV 5 on AWS</text>
  <text x="24" y="50" class="s">Road video to a costed, prioritised repair work order. Green = the Arm path where COOL executes the core image workload.</text>

  <!-- ============ SOURCES ============ -->
  <rect class="zone" x="20" y="72" width="196" height="214"/>
  <text x="32" y="90" class="zt">SOURCES</text>

  <rect class="box" x="34" y="100" width="168" height="62"/>
  <text x="46" y="119" class="tb">Phone in a vehicle</text>
  <text x="46" y="134" class="s">/capture.html — one HTTPS</text>
  <text x="46" y="148" class="s">POST per frame + GPS fix</text>

  <rect class="box aws" x="34" y="176" width="168" height="56"/>
  <text x="46" y="195" class="tb">S3 — recorded video</text>
  <text x="46" y="210" class="s">batch runs; raw footage</text>
  <text x="46" y="224" class="s">expires after 30 days</text>

  <text x="34" y="256" class="s">Both reach the same pipeline.</text>
  <text x="34" y="271" class="s">Live is push-based, batch is pull.</text>

  <!-- ============ EDGE ============ -->
  <rect class="zone" x="240" y="72" width="212" height="214"/>
  <text x="252" y="90" class="zt">PUBLIC SURFACE</text>

  <rect class="box aws" x="254" y="100" width="184" height="74"/>
  <text x="266" y="119" class="tb">CloudFront</text>
  <text x="266" y="134" class="s">HTTPS on a stable name —</text>
  <text x="266" y="148" class="s">browsers refuse camera and</text>
  <text x="266" y="162" class="s">GPS without it</text>

  <rect class="box aws" x="254" y="186" width="184" height="46"/>
  <text x="266" y="204" class="tb">S3 — pages + snapshot</text>
  <text x="266" y="219" class="s">default behaviour</text>

  <text x="254" y="252" class="s">/api/* → worker, caching off.</text>
  <text x="254" y="267" class="s">One origin, so no CORS.</text>

  <!-- ============ WORKER ============ -->
  <rect class="zone" x="476" y="72" width="268" height="396"/>
  <text x="488" y="90" class="zt">EPHEMERAL GRAVITON WORKER · COOL AMI</text>

  <rect class="box arm" x="490" y="100" width="240" height="58"/>
  <text x="502" y="119" class="tb">OpenCV 5 pipeline</text>
  <text x="502" y="134" class="s">rectify → propose → refine →</text>
  <text x="502" y="148" class="s">classify → track → score</text>

  <rect class="box arm" x="490" y="170" width="240" height="56"/>
  <text x="502" y="189" class="tb">COOL core pass</text>
  <text x="502" y="204" class="s">resize · adaptiveThreshold ·</text>
  <text x="502" y="218" class="s">findContours — 46% of the pass</text>

  <rect class="box cv" x="490" y="238" width="240" height="52"/>
  <text x="502" y="257" class="tb">Live session (per vehicle)</text>
  <text x="502" y="272" class="s">tracks carried forward; one</text>
  <text x="502" y="285" class="s">frame at a time, newest wins</text>

  <rect class="box cv" x="490" y="302" width="240" height="46"/>
  <text x="502" y="320" class="tb">MCP tool surface</text>
  <text x="502" y="335" class="s">one tool per pipeline stage</text>

  <rect class="box cv" x="490" y="360" width="240" height="56"/>
  <text x="502" y="379" class="tb">Agent loop</text>
  <text x="502" y="394" class="s">spread too wide → more views;</text>
  <text x="502" y="408" class="s">still wide → a human</text>

  <text x="490" y="440" class="s">Not in the template. A deploy</text>
  <text x="490" y="455" class="s">starts no compute at all.</text>

  <!-- ============ STATE ============ -->
  <rect class="zone" x="768" y="72" width="212" height="286"/>
  <text x="780" y="90" class="zt">DURABLE STATE</text>

  <rect class="box aws" x="782" y="100" width="184" height="74"/>
  <text x="794" y="119" class="tb">DynamoDB — ledger</text>
  <text x="794" y="134" class="s">partitioned by lat/lon cell,</text>
  <text x="794" y="148" class="s">not by run: a lookup reads</text>
  <text x="794" y="162" class="s">nine partitions, always</text>

  <rect class="box aws" x="782" y="186" width="184" height="46"/>
  <text x="794" y="204" class="tb">DynamoDB — defects</text>
  <text x="794" y="219" class="s">work orders, approvals</text>

  <rect class="box aws" x="782" y="244" width="184" height="46"/>
  <text x="794" y="262" class="tb">DynamoDB — traces</text>
  <text x="794" y="277" class="s">every agent decision, TTL'd</text>

  <rect class="box aws" x="782" y="302" width="184" height="44"/>
  <text x="794" y="320" class="tb">Bedrock</text>
  <text x="794" y="335" class="s">optional LLM driver, one model</text>

  <!-- ============ HUMAN ============ -->
  <rect class="zone" x="476" y="488" width="504" height="92"/>
  <text x="488" y="506" class="zt">THE GATE</text>

  <rect class="box hum" x="490" y="516" width="226" height="50"/>
  <text x="502" y="535" class="tb">Human approval</text>
  <text x="502" y="550" class="s">priority 1 always, however confident</text>

  <rect class="box" x="736" y="516" width="230" height="50"/>
  <text x="748" y="535" class="tb">Work order · GeoJSON</text>
  <text x="748" y="550" class="s">dispatchable only once approved</text>

  <!-- ============ EDGES ============ -->
  <path class="ln" d="M202 131 H 250"/>
  <path class="ln" d="M202 204 C 228 204, 228 150, 250 140"/>

  <path class="lnk" d="M438 137 H 486"/>
  <text x="444" y="130" class="el">/api/*</text>
  <path class="lnd" d="M438 209 C 460 209, 464 180, 460 160"/>
  <text x="300" y="296" class="el">snapshot fallback: the page works with the worker stopped</text>

  <path class="lnk" d="M730 129 H 778"/>
  <path class="lnk" d="M730 264 C 756 264, 760 200, 778 196"/>
  <path class="lnk" d="M730 388 C 758 388, 764 300, 778 268"/>
  <path class="lnk" d="M730 388 C 752 388, 770 350, 778 324"/>

  <path class="lnk" d="M610 416 V 512"/>
  <path class="ln" d="M716 541 H 732"/>
  <path class="lnd" d="M966 541 C 988 541, 996 420, 980 230"/>
  <text x="800" y="596" class="el">approval is recorded, then written back</text>

  <!-- legend -->
  <text x="24" y="596" class="zt">EPHEMERAL BY DESIGN</text>
  <text x="24" y="614" class="s">The worker is started for a drive or a benchmark and stopped afterwards. Everything that must outlive it —</text>
  <text x="24" y="630" class="s">the ledger, the work orders, the trace, and a deploy-time snapshot of a complete run — lives outside it.</text>
  <text x="24" y="646" class="s">Inbound to the worker is restricted to CloudFront's own prefix list; shell access is SSM, with no key pair.</text>
</svg>
