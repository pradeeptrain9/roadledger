<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .bg { fill: #fbfaf8; }
    .box { fill: #ffffff; stroke: #d8d4cc; stroke-width: 1.5; rx: 8; }
    .aws { fill: #fff8ec; stroke: #e0a558; }
    .arm { fill: #eef6f2; stroke: #4e9b85; }
    .cv  { fill: #eef1f8; stroke: #6a7fc4; }
    .zone { fill: none; stroke: #c9c4ba; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 10; }
    .t  { font-size: 13px; fill: #1a1a1a; }
    .tb { font-size: 13px; fill: #1a1a1a; font-weight: 600; }
    .s  { font-size: 11px; fill: #6b6b6b; }
    .zt { font-size: 11px; fill: #8a857c; font-weight: 600; letter-spacing: .06em; }
    .ln { stroke: #9a948a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .lnk { stroke: #4e9b85; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .el { font-size: 10.5px; fill: #6b6b6b; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9a948a"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4e9b85"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="620"/>

  <text x="24" y="30" class="tb" font-size="16">RoadLedger — OpenCV 5 on AWS</text>
  <text x="24" y="50" class="s">Dashcam video to a costed, prioritised repair work order. Green = the Arm path where COOL executes the core image workload.</text>

  <!-- Ingest -->
  <rect class="zone" x="20" y="70" width="190" height="150"/>
  <text x="32" y="88" class="zt">INGEST</text>
  <rect class="box aws" x="34" y="98" width="162" height="44"/>
  <text x="46" y="117" class="tb">S3</text>
  <text x="46" y="132" class="s">dashcam video, crops</text>
  <rect class="box aws" x="34" y="154" width="162" height="50"/>
  <text x="46" y="173" class="tb">EventBridge</text>
  <text x="46" y="188" class="s">new upload triggers a run</text>

  <!-- Orchestration -->
  <rect class="zone" x="232" y="70" width="200" height="230"/>
  <text x="244" y="88" class="zt">ORCHESTRATION</text>
  <rect class="box aws" x="246" y="98" width="172" height="58"/>
  <text x="258" y="117" class="tb">Lambda (arm64)</text>
  <text x="258" y="132" class="s">API, run lifecycle,</text>
  <text x="258" y="146" class="s">starts/stops the worker</text>
  <rect class="box aws" x="246" y="168" width="172" height="44"/>
  <text x="258" y="187" class="tb">API Gateway</text>
  <text x="258" y="202" class="s">HTTP API</text>
  <rect class="box aws" x="246" y="224" width="172" height="62"/>
  <text x="258" y="243" class="tb">DynamoDB</text>
  <text x="258" y="258" class="s">defect ledger,</text>
  <text x="258" y="272" class="s">agent decision trace</text>

  <!-- Graviton worker -->
  <rect class="zone" x="454" y="70" width="300" height="330" stroke="#4e9b85"/>
  <text x="466" y="88" class="zt" fill="#3d7a68">GRAVITON WORKER — ephemeral</text>
  <rect class="box arm" x="468" y="98" width="272" height="52"/>
  <text x="480" y="117" class="tb">EC2 m7g/c7g · COOL AMI</text>
  <text x="480" y="134" class="s">started per run, stopped after</text>

  <rect class="box arm" x="468" y="162" width="272" height="56"/>
  <text x="480" y="181" class="tb">MCP server</text>
  <text x="480" y="196" class="s">11 OpenCV tools over JSON-RPC;</text>
  <text x="480" y="210" class="s">every result stamped with the build</text>

  <rect class="box cv" x="468" y="230" width="272" height="86"/>
  <text x="480" y="249" class="tb">Core pass — COOL accelerated</text>
  <text x="480" y="266" class="s">resize · adaptiveThreshold · findContours</text>
  <text x="480" y="282" class="s">46% of the pass after profiling</text>
  <text x="480" y="300" class="s">3.40 ms/frame · 294 frames/s</text>

  <rect class="box cv" x="468" y="328" width="272" height="60"/>
  <text x="480" y="347" class="tb">OpenCV 5 analysis</text>
  <text x="480" y="363" class="s">rectify · refine · classify · track</text>
  <text x="480" y="378" class="s">CLAHE, Otsu, watershed, moments, LK</text>

  <!-- Decision -->
  <rect class="zone" x="776" y="70" width="186" height="230"/>
  <text x="788" y="88" class="zt">DECISION</text>
  <rect class="box aws" x="790" y="98" width="158" height="66"/>
  <text x="802" y="117" class="tb">Bedrock</text>
  <text x="802" y="132" class="s">sequences tool calls</text>
  <text x="802" y="147" class="s">(policy driver is the</text>
  <text x="802" y="159" class="s">reference)</text>
  <rect class="box" x="790" y="176" width="158" height="70"/>
  <text x="802" y="195" class="tb">Deterministic engine</text>
  <text x="802" y="210" class="s">severity, priority, cost</text>
  <text x="802" y="225" class="s">from a published rate</text>
  <text x="802" y="238" class="s">table. No model input.</text>
  <rect class="box" x="790" y="258" width="158" height="30"/>
  <text x="802" y="277" class="tb">Human approval gate</text>

  <!-- Delivery -->
  <rect class="zone" x="20" y="420" width="412" height="130"/>
  <text x="32" y="438" class="zt">DELIVERY</text>
  <rect class="box aws" x="34" y="448" width="180" height="56"/>
  <text x="46" y="467" class="tb">CloudFront + S3</text>
  <text x="46" y="482" class="s">ledger, map, trace,</text>
  <text x="46" y="496" class="s">approval gate</text>
  <rect class="box aws" x="228" y="448" width="190" height="56"/>
  <text x="240" y="467" class="tb">CloudWatch</text>
  <text x="240" y="482" class="s">tool calls, timings,</text>
  <text x="240" y="496" class="s">rule firings</text>

  <!-- Privacy note -->
  <rect class="box" x="454" y="420" width="300" height="76" fill="#fdf3f1" stroke="#c98a7e"/>
  <text x="466" y="440" class="tb">Privacy scrub — before anything persists</text>
  <text x="466" y="457" class="s">Faces (YuNet) and plates blurred on load.</text>
  <text x="466" y="472" class="s">Fails closed: a missing model raises rather</text>
  <text x="466" y="487" class="s">than passing frames through unscrubbed.</text>

  <!-- Benchmark note -->
  <rect class="box" x="776" y="420" width="186" height="76"/>
  <text x="788" y="440" class="tb">COOL benchmark</text>
  <text x="788" y="457" class="s">4 arms: x86 · Graviton</text>
  <text x="788" y="472" class="s">cv4 · Graviton cv5 ·</text>
  <text x="788" y="487" class="s">COOL. 5 repeats, median.</text>

  <!-- flows -->
  <path class="ln" d="M196 120 L246 120"/>
  <path class="ln" d="M196 178 L246 185"/>
  <path class="lnk" d="M418 130 L468 124"/>
  <text x="424" y="118" class="el">run</text>
  <path class="lnk" d="M468 196 L440 196 L440 255 L418 255"/>
  <text x="430" y="212" class="el">trace</text>
  <path class="ln" d="M740 190 L790 150"/>
  <text x="744" y="172" class="el">tools</text>
  <path class="ln" d="M869 288 L869 330 L240 330 L240 448"/>
  <text x="560" y="325" class="el">defects, work orders, trace</text>
  <path class="ln" d="M604 390 L604 420"/>
  <path class="ln" d="M332 286 L332 420"/>

  <text x="24" y="580" class="s">Core pass is built from exactly the three operations COOL accelerates, so the COOL measurement is of the workload that carries the product.</text>
  <text x="24" y="600" class="s">The Graviton worker is stopped between runs; the endpoint answers from cached results so a reviewer never waits on a boot.</text>
</svg>
